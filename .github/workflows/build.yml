name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Test basic run
        run: .\build\Release\find4w.exe --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: find4w-x64
          path: build/Release/find4w.exe
